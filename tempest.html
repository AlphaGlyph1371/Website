<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Tempest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="tempest.css">
</head>
<body>

<div class="page-bg"></div>

<div class="container">

  <!-- Card 1: Intro -->
  <div class="card-wrapper">
    <div class="card">

      <div class="profile">
        <img src="/images/avatar.png" alt="Tempest Avatar">
      </div>

      <h1>TEMPEST</h1>

      <p class="subtitle">
        Developer focused on control, performance and clean systems.
      </p>

      <p class="description">
        I build minimal and powerful things with purpose.
        Always learning. Always evolving.
      </p>

    </div>
  </div>

  <!-- Card 2: Showcase -->
  <div class="card-wrapper wide">
    <div class="card showcase">

      <div class="section">
        <h2>GROUPS I WORKED WITH</h2>
        <div class="circle-grid">

          <a class="circle-item" href="https://www.roblox.com/communities/34826121/Blaxs-Studios#!/about" target="_blank">
            <img src="/images/group1.png" alt="Blaxs Studios">
          </a>

          <a class="circle-item" href="https://www.roblox.com/communities/32961522/Fantomatic-GAMES#!/about" target="_blank">
            <img src="/images/group2.png" alt="Fantomatic Games">
          </a>

          <a class="circle-item" href="https://www.roblox.com/communities/5762243/Nerdo-Studios#!/about" target="_blank">
            <img src="/images/group3.png" alt="Nerdo Studios">
          </a>

        </div>
      </div>

      <div class="section">
        <h2>GAMES I HAVE WORKED ON</h2>
        <div class="circle-grid">

          <a class="circle-item" href="https://www.roblox.com/games/78856317811012/Flowers-Incremental" target="_blank">
            <img src="/images/game1.png" alt="Flowers Incremental">
          </a>

          <a class="circle-item" href="https://www.roblox.com/games/116526689628602/Button-Simulator-Adventure" target="_blank">
            <img src="/images/game2.png" alt="Button Simulator Adventure">
          </a>

          <a class="circle-item" href="https://www.roblox.com/games/107117831296339/Button-Simulator-Nature" target="_blank">
            <img src="/images/game3.png" alt="Button Simulator Nature">
          </a>

        </div>
      </div>

    </div>
  </div>

  <!-- Card 3: Contacts -->
  <div class="card-wrapper">
    <div class="card contacts">

      <h2>CONTACTS</h2>

      <a class="contact-btn" href="https://www.roblox.com/users/1434465668/profile" target="_blank">
        🧑‍💻 Roblox Profile
      </a>

      <a class="contact-btn" href="https://www.roblox.com/communities/1043365235/Demon-Slayer-Ashen-Fate#!/about" target="_blank">
        👥 Roblox Group
      </a>

      <a class="contact-btn" href="https://discord.gg/uHjMZ3ZZmT" target="_blank">
        💬 Discord Server
      </a>

    </div>
  </div>

</div>

<!-- Cursor Glow -->
<div class="cursor-glow"></div>

<script>
  const glow = document.querySelector('.cursor-glow');

  document.addEventListener('mousemove', (e) => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });
</script>

</body>
</html>
