<!DOCTYPE html>
<html lang="en" data-season="default">

<head>
  <meta charset="UTF-8" />
  <title>Alpha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="snow"></div>
  <div class="season-overlay" aria-hidden="true"></div>
  <div id="cursor-glow"></div>
  <svg class="glitch-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <filter id="intro-glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.7" numOctaves="1" seed="2" result="noise">
        <animate attributeName="seed" dur="0.24s" values="2;9;4;12;6;3;2" repeatCount="1" />
        <animate attributeName="baseFrequency" dur="0.24s" values="0.02 0.7;0.12 1;0.06 0.85;0.03 0.75;0.02 0.7" repeatCount="1" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="0.24s" values="0;52;36;22;12;6;0" repeatCount="1" />
      </feDisplacementMap>
    </filter>
  </svg>

  <div class="wrap">
    <div class="season-badge" aria-hidden="true"></div>
    <div class="meta-mini" aria-hidden="true">
      <div class="pill"><b>theme</b>: <span id="themeName">default</span></div>
      <div class="pill"><b>motion</b>: <span id="motionName">full</span></div>
    </div>
    <h1 class="title" data-text="ALPHA">ALPHA</h1>

    <div class="sub">
      <span>dev domain · minimal surface</span>
      <span> · </span>
      <button class="kbd-btn" id="openPaletteBtn" type="button" aria-label="Open command palette">
        <kbd>Ctrl/⌘K</kbd>
      </button>
      <span>commands</span>
    </div>

    <div class="buttons">
      <a class="btn github" href="https://github.com/AlphaGlyph1371" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg" alt="">
        GitHub
      </a>

      <button class="btn discord" id="discordBtn" data-name="alphav5" type="button">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/discord.svg" alt="">
        Discord: alphav5
      </button>
    </div>

    <div class="discord-card" id="discordCard" data-user-id="616347662718992394">
      <div class="discord-avatar-wrap">
        <img class="discord-avatar" alt="" />
        <img class="discord-decoration" alt="" />
      </div>
      <div class="discord-info">
        <div class="discord-name">Discord</div>
        <div class="discord-status" data-status="offline">offline</div>
        <div class="discord-activity">No activity</div>
      </div>
    </div>

    <footer id="footer-text">no noise · no tracking · no ads · no explanation</footer>

  </div>

  <!-- Command palette -->
  <div class="palette-backdrop" id="palette" data-open="false" aria-hidden="true">
    <div class="palette" role="dialog" aria-label="Command palette">
      <div class="palette-top">
        <input id="cmdInput" placeholder="Type a command… (github / discord / season / motion)" autocomplete="off" />
        <button class="kbd-btn" id="closePaletteBtn" type="button" aria-label="Close command palette">
          <div class="hint">Esc</div>
        </button>
      </div>
      <div class="cmds" id="cmdList"></div>
    </div>
  </div>

  <script>
    // ===== Season Detection =====
    (function () {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();

      let currentSeason = "default";
      if (m === 12 && (d === 24 || d === 25)) currentSeason = "christmas-eve";
      else if ((m === 10 && d >= 25) || (m === 11 && d <= 2)) currentSeason = "halloween";
      else if ((m === 12 && d >= 15) || (m === 1 && d <= 5)) currentSeason = "christmas";
      else if (m === 12 || m === 1 || m === 2) currentSeason = "winter";
      else if (m >= 3 && m <= 5) currentSeason = "spring";
      else if (m >= 6 && m <= 8) currentSeason = "summer";
      else if (m >= 9 && m <= 11) currentSeason = "autumn";

      document.documentElement.dataset.season = currentSeason;
    })();

    // ===== Discord Copy =====
    const dBtn = document.getElementById('discordBtn');
    async function copyDiscord() {
      const name = dBtn.dataset.name;
      try {
        await navigator.clipboard.writeText(name);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = name;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      const old = dBtn.innerHTML;
      dBtn.innerHTML = '✓ Copied';
      setTimeout(() => dBtn.innerHTML = old, 1200);
    }
    dBtn.addEventListener('click', copyDiscord);

    // ===== Discord Presence (public via Lanyard) =====
    (function () {
      const card = document.getElementById('discordCard');
      if (!card) return;
      const userId = card.dataset.userId;
      if (!userId) return;

      const avatarEl = card.querySelector('.discord-avatar');
      const decoEl = card.querySelector('.discord-decoration');
      const nameEl = card.querySelector('.discord-name');
      const statusEl = card.querySelector('.discord-status');
      const activityEl = card.querySelector('.discord-activity');

      fetch(`https://api.lanyard.rest/v1/users/${userId}`)
        .then(r => r.json())
        .then(({ data }) => {
          if (!data || !data.discord_user) throw new Error('no data');
          const user = data.discord_user;
          const avatarHash = user.avatar;
          const fallbackIndex = Number(user.discriminator || 0) % 5;
          const avatarUrl = avatarHash
            ? `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.png?size=128`
            : `https://cdn.discordapp.com/embed/avatars/${fallbackIndex}.png`;

          avatarEl.src = avatarUrl;
          avatarEl.alt = `${user.username} avatar`;
          nameEl.textContent = user.display_name || user.username;

          const status = data.discord_status || 'offline';
          const statusLabels = {
            online: 'online',
            idle: 'idle',
            dnd: 'do not disturb',
            offline: 'offline'
          };
          statusEl.dataset.status = status;
          statusEl.textContent = statusLabels[status] || status;

          const activity = (data.activities || []).find(a => a.type !== 4);
          if (!activity) {
            activityEl.textContent = 'No activity';
          } else if (activity.name === 'Spotify') {
            const song = activity.details || 'Unknown song';
            const artist = activity.state || 'Unknown artist';
            activityEl.textContent = `Spotify: ${artist} - ${song}`;
          } else {
            const parts = [];
            if (activity.details) parts.push(activity.details);
            if (activity.state) parts.push(activity.state);
            activityEl.textContent = parts.length
              ? `${activity.name}: ${parts.join(' - ')}`
              : activity.name;
          }

          const deco = user.avatar_decoration_data && user.avatar_decoration_data.asset;
          if (deco) {
            decoEl.src = `https://cdn.discordapp.com/avatar-decoration-presets/${deco}.png`;
            decoEl.alt = 'Avatar decoration';
            decoEl.style.display = 'block';
          } else {
            decoEl.style.display = 'none';
          }
        })
        .catch(() => {
          statusEl.dataset.status = 'offline';
          statusEl.textContent = 'offline';
          activityEl.textContent = 'Presence unavailable';
          decoEl.style.display = 'none';
        });
    })();

    // ===== Footer seasonal text =====
    (function () {
      const s = document.documentElement.dataset.season;
      const footer = document.getElementById('footer-text');

      if (s === 'halloween') footer.textContent = 'trick or treat · no bugs · clean code';
      else if (s === 'christmas') footer.textContent = 'silent night · clean signal';
      else if (s === 'christmas-eve') footer.textContent = 'holy night · calm signal';
      else if (s === 'winter') footer.textContent = 'cold air · warm code';
      else if (s === 'spring') footer.textContent = 'fresh bloom · clean builds';
      else if (s === 'summer') footer.textContent = 'bright days · clean deploys';
      else if (s === 'autumn') footer.textContent = 'soft amber · steady code';
      else footer.textContent = 'no noise · no tracking · no ads · no explanation';
    })();

    // ===== Cursor Glow Follow + Snap =====
    const glow = document.getElementById('cursor-glow');
    const buttons = document.querySelectorAll('.btn');

    let mouseX = innerWidth / 2;
    let mouseY = innerHeight / 2;
    let gx = mouseX;
    let gy = mouseY;
    let locked = false;

    window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

    let rafId = null;
    function animate() {
      if (!locked) {
        gx += (mouseX - gx) * 0.16;
        gy += (mouseY - gy) * 0.16;
        glow.style.left = gx + 'px';
        glow.style.top = gy + 'px';
      }
      rafId = requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        animate();
      }
    });

    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        const r = btn.getBoundingClientRect();
        locked = true;

        glow.style.left = (r.left + r.width / 2) + 'px';
        glow.style.top = (r.top + r.height / 2) + 'px';
        glow.style.width = (r.width + 24) + 'px';
        glow.style.height = (r.height + 24) + 'px';
        glow.style.borderRadius = '18px';

        glow.style.background = `
          linear-gradient(90deg, var(--snap-soft), var(--snap-strong), var(--snap-soft)),
          linear-gradient(0deg, var(--snap-soft), var(--snap-strong), var(--snap-soft))
        `;
        glow.style.filter = 'blur(18px)';
        glow.style.opacity = '.62';
      });

      btn.addEventListener('mouseleave', () => {
        locked = false;

        glow.style.width = '260px';
        glow.style.height = '260px';
        glow.style.borderRadius = '50%';
        glow.style.background = `
          radial-gradient(circle, var(--glow-main), var(--glow-soft), transparent 65%)
        `;
        glow.style.filter = 'blur(20px)';
        glow.style.opacity = '.9';
      });
    });

    const themeEl = document.getElementById('themeName');
    const motionEl = document.getElementById('motionName');

    function tickMeta() {
      themeEl.textContent = document.documentElement.dataset.season || 'default';
      motionEl.textContent = document.documentElement.dataset.motion === 'reduced' ? 'reduced' : 'full';
    }
    tickMeta();
    setInterval(tickMeta, 1000);

    // ===== Command Palette =====
    const palette = document.getElementById('palette');
    const cmdInput = document.getElementById('cmdInput');
    const cmdList = document.getElementById('cmdList');

    const COMMANDS = [
      {
        key: 'github',
        name: 'Open GitHub',
        desc: 'Go to github.com/AlphaGlyph1371',
        run: () => window.open('https://github.com/AlphaGlyph1371', '_blank', 'noopener,noreferrer')
      },
      {
        key: 'discord',
        name: 'Copy Discord',
        desc: 'Copy: alphav5',
        run: () => copyDiscord()
      },
      {
        key: 'season',
        name: 'Next Season Theme',
        desc: 'Cycle: default → spring → summer → autumn → winter → halloween → christmas → christmas-eve',
        run: () => window.season.next()
      },
      {
        key: 'motion',
        name: 'Toggle Reduced Motion',
        desc: 'Disable animations if you want it calmer',
        run: () => {
          const html = document.documentElement;
          html.dataset.motion = (html.dataset.motion === 'reduced') ? 'full' : 'reduced';
          tickMeta();
        }
      }
    ];

    function openPalette() {
      palette.dataset.open = "true";
      palette.setAttribute('aria-hidden', 'false');
      cmdInput.value = "";
      renderCommands("");
      cmdInput.focus();
    }

    function closePalette() {
      palette.dataset.open = "false";
      palette.setAttribute('aria-hidden', 'true');
      cmdInput.blur();
    }

    const openPaletteBtn = document.getElementById('openPaletteBtn');
    if (openPaletteBtn) openPaletteBtn.addEventListener('click', openPalette);
    const closePaletteBtn = document.getElementById('closePaletteBtn');
    if (closePaletteBtn) closePaletteBtn.addEventListener('click', closePalette);

    function renderCommands(filter) {
      const q = filter.trim().toLowerCase();
      const items = COMMANDS.filter(c =>
        !q ||
        c.key.includes(q) ||
        c.name.toLowerCase().includes(q) ||
        c.desc.toLowerCase().includes(q)
      );

      cmdList.innerHTML = items.map(c => `
        <div class="cmd" data-key="${c.key}">
          <div class="left">
            <div class="name">${c.name}</div>
            <div class="desc">${c.desc}</div>
          </div>
          <kbd>↵</kbd>
        </div>
      `).join("");

      cmdList.querySelectorAll('.cmd').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.dataset.key;
          const cmd = COMMANDS.find(x => x.key === key);
          if (!cmd) return;
          cmd.run();
          closePalette();
        });
      });
    }

    cmdInput.addEventListener('input', e => renderCommands(e.target.value));
    cmdInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePalette();
      if (e.key === 'Enter') {
        const first = cmdList.querySelector('.cmd');
        if (!first) return;
        first.click();
      }
    });

    palette.addEventListener('mousedown', (e) => {
      if (e.target === palette) closePalette();
    });

    // hotkeys
    window.addEventListener('keydown', (e) => {
      const isMac = navigator.platform.toLowerCase().includes('mac');
      const k = e.key.toLowerCase();

      if ((isMac ? e.metaKey : e.ctrlKey) && k === 'k') {
        e.preventDefault();
        if (palette.dataset.open === "true") closePalette();
        else openPalette();
      }
      if (k === '?' && palette.dataset.open !== "true") {
        // quick open (optional)
        openPalette();
      }
      if (e.key === 'Escape' && palette.dataset.open === "true") closePalette();
    });

    // ===== Intro glitch =====
    (function () {
      const html = document.documentElement;
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (html.dataset.motion === 'reduced' || prefersReduced) return;

      document.body.classList.add('intro-glitch');
      setTimeout(() => document.body.classList.remove('intro-glitch'), 260);
    })();

    // ===== Console season control (kept) =====
    window.season = {
      set(name) {
        const valid = ['default', 'spring', 'summer', 'autumn', 'winter', 'halloween', 'christmas', 'christmas-eve'];
        if (!valid.includes(name)) return console.warn('Invalid:', name);       

        document.documentElement.dataset.season = name;

        const footer = document.getElementById('footer-text');
        if (name === 'halloween') footer.textContent = 'trick or treat · no bugs · clean code';
        else if (name === 'christmas') footer.textContent = 'silent night · clean signal';
        else if (name === 'christmas-eve') footer.textContent = 'holy night · calm signal';
        else if (name === 'winter') footer.textContent = 'cold air · warm code';
        else if (name === 'spring') footer.textContent = 'fresh bloom · clean builds';
        else if (name === 'summer') footer.textContent = 'bright days · clean deploys';
        else if (name === 'autumn') footer.textContent = 'soft amber · steady code';
        else footer.textContent = 'no noise · no tracking · no ads · no explanation';

        tickMeta();
        console.info('Season set to:', name);
      },
      current() { return document.documentElement.dataset.season; },
      next() {
        const order = ['default', 'spring', 'summer', 'autumn', 'winter', 'halloween', 'christmas', 'christmas-eve'];
        const i = order.indexOf(this.current());
        this.set(order[(i + 1) % order.length]);
      }
    };

    console.info('%cCommands: Ctrl/⌘K', 'color: var(--accent); font-family: monospace');
  </script>
</body>

</html>
