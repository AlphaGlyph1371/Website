<!DOCTYPE html>
<html lang="en" data-season="default">

<head>
    <meta charset="UTF-8" />
    <title>Alpha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #05070c;
            --fg: #e6ebff;
            --muted: #9aa3c7;
            --accent: #8df6ff;
            --line: rgba(255, 255, 255, .08);

            --glow-main: rgba(141, 246, 255, 0.25);
            --glow-soft: rgba(141, 246, 255, 0.12);

            --snap-strong: rgba(141, 246, 255, 0.22);
            --snap-soft: rgba(141, 246, 255, 0.0);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            -webkit-user-select: none;
            -webkit-user-drag: none;
            user-select: none;

            cursor: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'>\
<path d='M2 1 L2 14 L5.5 10.5 L8.5 16 L10 15 L7 9.5 L11 9 L2 1 Z' fill='black' stroke='white' stroke-width='0.8'/>\
</svg>") 2 2, auto;
        }

        body {
            margin: 0;
            height: 100vh;
            background:
                radial-gradient(900px 600px at 20% 20%, rgba(141, 246, 255, .12), transparent 60%),
                linear-gradient(180deg, #04060a, #060913);
            color: var(--fg);
            font-family: Inter, system-ui;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, .04) 0px,
                    rgba(0, 0, 0, 0) 3px,
                    rgba(0, 0, 0, 0) 6px);
            pointer-events: none;
            opacity: .25;
        }

        .wrap {
            position: relative;
            text-align: center;
            padding: 32px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .04);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            min-width: 280px;
            max-width: 90vw;
            box-shadow: 0 40px 120px rgba(0, 0, 0, .6);
            z-index: 2;
        }

        .title {
            font-family: "Bebas Neue";
            font-size: clamp(56px, 9vw, 96px);
            letter-spacing: .12em;
            line-height: .9;
            margin: 0;
            text-transform: uppercase;
            position: relative;
        }

        .title::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            color: var(--accent);
            opacity: .5;
            transform: translate(2px, 0);
            clip-path: inset(60% 0 0 0);
            animation: glitch 2.8s infinite steps(12);
        }

        @keyframes glitch {

            0%,
            100% {
                clip-path: inset(0 0 0 0)
            }

            30% {
                clip-path: inset(70% 0 10% 0)
            }

            60% {
                clip-path: inset(20% 0 60% 0)
            }
        }

        .buttons {
            margin-top: 28px;
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .35);
            color: var(--fg);
            text-decoration: none;
            font-family: "Space Mono";
            font-size: 13px;
            letter-spacing: .04em;
            transition: .2s ease;
            min-width: 200px;
            justify-content: center;
        }

        .btn img {
            width: 16px;
            height: 16px;
            filter: invert(1);
            opacity: .9;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: rgba(141, 246, 255, .08);
        }

        footer {
            margin-top: 24px;
            font-size: 11px;
            color: rgba(154, 163, 199, .6);
            font-family: "Space Mono";
        }

        a,
        button,
        .btn,
        input,
        textarea,
        select,
        label {
            cursor: inherit !important;
        }

        /* ===== GLOW ===== */
        #cursor-glow {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle,
                    var(--glow-main),
                    var(--glow-soft),
                    transparent 65%);
            filter: blur(20px);
            opacity: .9;
            transform: translate(-50%, -50%);
            transition:
                width .22s cubic-bezier(.22, 1, .36, 1),
                height .22s cubic-bezier(.22, 1, .36, 1),
                border-radius .22s cubic-bezier(.22, 1, .36, 1),
                background .28s ease,
                opacity .28s ease,
                filter .28s ease;
            will-change: left, top, width, height, transform;
        }

        @media (hover: none) {
            #cursor-glow {
                display: none;
            }
        }

        /* ===== Seasonal: Halloween ===== */
        html[data-season="halloween"] {
            --accent: #ff9f43;
            --fg: #ffe7cc;
            --muted: #caa36a;
            --glow-main: rgba(255, 159, 67, 0.35);
            --glow-soft: rgba(255, 159, 67, 0.18);
            --snap-strong: rgba(255, 159, 67, 0.32);
            --snap-soft: rgba(255, 159, 67, 0.0);
        }

        html[data-season="halloween"] body {
            background:
                radial-gradient(800px 500px at 80% 20%, rgba(255, 159, 67, .18), transparent 60%),
                linear-gradient(180deg, #0b0600, #140900);
        }

        .pumpkin {
            position: absolute;
            bottom: -14px;
            right: -14px;
            font-size: 48px;
            filter: drop-shadow(0 0 12px rgba(255, 159, 67, .6));
            animation: float 4s ease-in-out infinite;
            z-index: 3;
        }

        /* ===== Seasonal: Christmas ===== */
        html[data-season="christmas"] {
            --accent: #9fdcff;
            --fg: #f2f8ff;
            --muted: #b8d2ea;
            --glow-main: rgba(159, 220, 255, 0.35);
            --glow-soft: rgba(159, 220, 255, 0.18);
            --snap-strong: rgba(159, 220, 255, 0.30);
            --snap-soft: rgba(159, 220, 255, 0.0);
        }

        html[data-season="christmas"] body {
            background:
                radial-gradient(900px 600px at 20% 20%, rgba(159, 220, 255, .25), transparent 60%),
                linear-gradient(180deg, #020612, #040b18);
        }

        .hat {
            position: absolute;
            top: -18px;
            right: -16px;
            font-size: 42px;
            transform: rotate(12deg);
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .35));
            z-index: 3;
        }

        /* snow overlay (css-only) */
        .snow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .0;
            transition: opacity .35s ease;
            background-image:
                radial-gradient(2px 2px at 20% 10%, rgba(255, 255, 255, .95), transparent),
                radial-gradient(2px 2px at 80% 30%, rgba(255, 255, 255, .85), transparent),
                radial-gradient(1.6px 1.6px at 50% 55%, rgba(255, 255, 255, .8), transparent),
                radial-gradient(1.2px 1.2px at 35% 70%, rgba(255, 255, 255, .7), transparent),
                radial-gradient(1.2px 1.2px at 65% 85%, rgba(255, 255, 255, .7), transparent);
            animation: snow 12s linear infinite;
        }

        html[data-season="christmas"] .snow {
            opacity: .35;
        }

        @keyframes snow {
            from {
                background-position: 0 -120px;
            }

            to {
                background-position: 0 720px;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }
    </style>
</head>

<body>
    <div class="snow"></div>
    <div id="cursor-glow"></div>

    <div class="wrap">
        <h1 class="title" data-text="ALPHA">ALPHA</h1>

        <div class="buttons">
            <a class="btn github" href="https://github.com/AlphaGlyph1371" target="_blank">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg" alt="">
                GitHub
            </a>

            <button class="btn discord" id="discordBtn" data-name="alphav5">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/discord.svg" alt="">
                Discord: alphav5
            </button>
        </div>

        <footer id="footer-text">no noise · no tracking · no ads · no explanation</footer>

        <div class="pumpkin" id="pumpkin" hidden>🎃</div>
        <div class="hat" id="hat" hidden>🎅</div>
    </div>

    <script>
        // ===== Season Detection (no name collision) =====
        (function () {
            const now = new Date();
            const m = now.getMonth() + 1;
            const d = now.getDate();

            let currentSeason = "default";
            if ((m === 10 && d >= 25) || (m === 11 && d <= 2)) currentSeason = "halloween";
            if ((m === 12 && d >= 15) || (m === 1 && d <= 5)) currentSeason = "christmas";

            document.documentElement.dataset.season = currentSeason;
        })();

        // ===== Discord Copy (restored) =====
        const dBtn = document.getElementById('discordBtn');
        dBtn.addEventListener('click', async () => {
            const name = dBtn.dataset.name;

            try {
                await navigator.clipboard.writeText(name);
            } catch (e) {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = name;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            }

            const old = dBtn.innerHTML;
            dBtn.innerHTML = '✓ Copied';
            setTimeout(() => dBtn.innerHTML = old, 1200);
        });

        // ===== Seasonal UI bits (pumpkin/hat/footer) =====
        (function () {
            const s = document.documentElement.dataset.season;
            const pumpkin = document.getElementById('pumpkin');
            const hat = document.getElementById('hat');
            const footer = document.getElementById('footer-text');

            pumpkin.hidden = true;
            hat.hidden = true;

            if (s === 'halloween') {
                pumpkin.hidden = false;
                footer.textContent = 'trick or treat · no bugs · clean code';
            } else if (s === 'christmas') {
                hat.hidden = false;
                footer.textContent = 'silent night · clean signal';
            } else {
                footer.textContent = 'no noise · no tracking · no ads · no explanation';
            }
        })();

        // ===== Cursor Glow Follow + Snap (restored) =====
        const glow = document.getElementById('cursor-glow');
        const buttons = document.querySelectorAll('.btn');

        let mouseX = innerWidth / 2;
        let mouseY = innerHeight / 2;
        let gx = mouseX;
        let gy = mouseY;
        let locked = false;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            if (!locked) {
                // faster follow (was 0.08) – closer to your original feel
                gx += (mouseX - gx) * 0.16;
                gy += (mouseY - gy) * 0.16;

                glow.style.left = gx + 'px';
                glow.style.top = gy + 'px';
            }
            requestAnimationFrame(animate);
        }
        animate();

        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                const r = btn.getBoundingClientRect();
                locked = true;

                glow.style.left = (r.left + r.width / 2) + 'px';
                glow.style.top = (r.top + r.height / 2) + 'px';
                glow.style.width = (r.width + 24) + 'px';
                glow.style.height = (r.height + 24) + 'px';
                glow.style.borderRadius = '18px';

                glow.style.background = `
  linear-gradient(90deg,
    var(--snap-soft),
    var(--snap-strong),
    var(--snap-soft)
  ),
  linear-gradient(0deg,
    var(--snap-soft),
    var(--snap-strong),
    var(--snap-soft)
  )
`;

                glow.style.filter = 'blur(18px)';
                glow.style.opacity = '.65';
            });

            btn.addEventListener('mouseleave', () => {
                locked = false;

                glow.style.width = '260px';
                glow.style.height = '260px';
                glow.style.borderRadius = '50%';
                glow.style.background = `
          radial-gradient(circle,
            var(--glow-main),
            var(--glow-soft),
            transparent 65%)
        `;
                glow.style.filter = 'blur(20px)';
                glow.style.opacity = '.9';
            });
        });

        // ===== Console Mode Switch (no collision) =====
        window.season = {
            set(name) {
                const valid = ['default', 'halloween', 'christmas'];
                if (!valid.includes(name)) return console.warn('Invalid:', name);

                document.documentElement.dataset.season = name;

                // re-apply seasonal UI bits
                const pumpkin = document.getElementById('pumpkin');
                const hat = document.getElementById('hat');
                const footer = document.getElementById('footer-text');

                pumpkin.hidden = true;
                hat.hidden = true;

                if (name === 'halloween') {
                    pumpkin.hidden = false;
                    footer.textContent = 'trick or treat · no bugs · clean code';
                } else if (name === 'christmas') {
                    hat.hidden = false;
                    footer.textContent = 'silent night · clean signal';
                } else {
                    footer.textContent = 'no noise · no tracking · no ads · no explanation';
                }

                console.info('Season set to:', name);
            },
            current() { return document.documentElement.dataset.season; },
            next() {
                const order = ['default', 'halloween', 'christmas'];
                const i = order.indexOf(this.current());
                this.set(order[(i + 1) % order.length]);
            }
        };

        console.info('%cSeason control loaded', 'color: var(--accent); font-family: monospace');
        console.info('Use: season.set("halloween") / season.next()');
    </script>
</body>

</html>
